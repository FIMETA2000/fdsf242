<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Reddit Story Studio</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<style>

/* =========================
   RESET
========================= */

*{

    margin:0;
    padding:0;

    box-sizing:border-box;

}

html,
body{

    width:100%;
    height:100%;

    overflow:hidden;

    font-family:Inter,Arial,sans-serif;

    background:#00ff00;

    color:#fff;

}

body{

    display:flex;

    align-items:center;

    justify-content:center;

}


/* =========================
   GREEN SCREEN BACKGROUND
========================= */

body{

    background:#00ff00;

}


/* =========================
   SIDEBAR
========================= */

.sidebar{

    position:fixed;

    left:30px;
    top:30px;

    width:340px;

    height:calc(100vh - 60px);

    overflow-y:auto;

    padding:28px;

    background:#111;

    border-radius:24px;

    border:1px solid #222;

    box-shadow:0 20px 60px rgba(0,0,0,.35);

    z-index:10;

}

.sidebar h1{

    font-size:28px;

    margin-bottom:28px;

}

.section{

    margin-bottom:20px;

}

.section label{

    display:block;

    margin-bottom:8px;

    color:#ddd;

    font-size:14px;

    font-weight:700;

}

.section input,
.section textarea{

    width:100%;

    padding:13px 14px;

    border-radius:12px;

    border:1px solid #333;

    background:#181818;

    color:#fff;

    font-family:inherit;

    font-size:14px;

    outline:none;

}

.section input:focus,
.section textarea:focus{

    border-color:#4d7cff;

}

.section textarea{

    height:220px;

    resize:none;

    line-height:1.5;

}


/* =========================
   BUTTONS
========================= */

.buttons{

    display:flex;

    flex-direction:column;

    gap:12px;

    margin-top:25px;

}

.buttons button{

    width:100%;

    height:52px;

    border:none;

    border-radius:13px;

    background:#3265f5;

    color:white;

    font-family:inherit;

    font-size:15px;

    font-weight:700;

    cursor:pointer;

    transition:.2s;

}

.buttons button:hover{

    background:#4678ff;

    transform:translateY(-2px);

}

.buttons button:active{

    transform:scale(.98);

}

#exitOBS{

    background:#222;

}

#exitOBS:hover{

    background:#333;

}


/* =========================
   PREVIEW AREA
========================= */

.preview{

    position:absolute;

    left:400px;

    right:40px;

    top:50%;

    transform:translateY(-50%);

    display:flex;

    justify-content:center;

    align-items:center;

}


/* =========================
   REDDIT CARD
========================= */

.redditCard{

    position:relative;

    width:min(1000px, calc(100vw - 480px));

    height:800px;

    background:#000;

    border-radius:28px;

    border:1px solid #222;

    overflow:hidden;

    box-shadow:0 25px 70px rgba(0,0,0,.45);

    display:flex;

    flex-direction:column;

}


/* =========================
   HEADER
========================= */

.redditHeader{

    display:flex;

    align-items:center;

    gap:16px;

    padding:35px 38px 0 38px;

    flex-shrink:0;

}

.avatar{

    width:62px;

    height:62px;

    border-radius:50%;

    overflow:hidden;

    background:#222;

    flex-shrink:0;

}

.avatar img{

    width:100%;

    height:100%;

    object-fit:cover;

}

.subreddit{

    font-size:21px;

    font-weight:800;

    color:#fff;

}

.meta{

    margin-top:5px;

    color:#999;

    font-size:15px;

}


/* =========================
   CONTENT
========================= */

.cardContent{

    padding:0 38px;

    flex:1;

    min-height:0;

    display:flex;

    flex-direction:column;

}

.redditCard h2{

    margin-top:30px;

    margin-bottom:25px;

    font-size:38px;

    line-height:1.25;

    color:#fff;

    font-weight:800;

    flex-shrink:0;

}

.story{

    flex:1;

    min-height:0;

    overflow-y:auto;

    overflow-x:hidden;

    padding-right:12px;

    padding-bottom:20px;

    font-size:25px;

    line-height:1.65;

    color:#fff;

    white-space:pre-wrap;

}

.story::-webkit-scrollbar{

    width:7px;

}

.story::-webkit-scrollbar-track{

    background:transparent;

}

.story::-webkit-scrollbar-thumb{

    background:#444;

    border-radius:20px;

}


/* =========================
   BOTTOM BAR
========================= */

.bottomBar{

    display:flex;

    align-items:center;

    gap:35px;

    padding:20px 38px 30px 38px;

    color:#fff;

    font-size:20px;

    flex-shrink:0;

    background:#000;

}

.bottomItem{

    display:flex;

    align-items:center;

    gap:8px;

}

.upvoteIcon{

    font-size:24px;

    line-height:1;

}

.commentIcon{

    font-size:22px;

    line-height:1;

}


/* =========================
   OBS MODE
========================= */

body.obs{

    background:#00ff00;

}

body.obs .sidebar{

    display:none;

}

body.obs .preview{

    position:fixed;

    left:50%;

    top:50%;

    right:auto;

    width:auto;

    transform:translate(-50%,-50%);

}

body.obs .redditCard{

    width:1200px;

    height:850px;

}


/* =========================
   OBS EXIT BUTTON
========================= */

body.obs #exitOBS{

    display:block !important;

}


/* =========================
   SCROLLBAR SIDEBAR
========================= */

.sidebar::-webkit-scrollbar{

    width:7px;

}

.sidebar::-webkit-scrollbar-track{

    background:#111;

}

.sidebar::-webkit-scrollbar-thumb{

    background:#444;

    border-radius:20px;

}


/* =========================
   MOBILE
========================= */

@media(max-width:1400px){

    .sidebar{

        width:320px;

    }

    .preview{

        left:370px;

    }

    .redditCard{

        width:calc(100vw - 420px);

    }

}

</style>

</head>


<body>


<!-- =========================
     SIDEBAR
========================= -->

<div class="sidebar">

<h1>Reddit Story Studio</h1>


<div class="section">

<label>Avatar</label>

<input
type="file"
id="avatarUpload"
accept="image/*">

</div>


<div class="section">

<label>Subreddit</label>

<input
id="subreddit"
value="r/LetsNotMeet">

</div>


<div class="section">

<label>Author</label>

<input
id="author"
value="u/Anonymous">

</div>


<div class="section">

<label>Time</label>

<input
id="time"
value="8 hr. ago">

</div>


<div class="section">

<label>Upvotes</label>

<input
id="upvotes"
value="18.2k">

</div>


<div class="section">

<label>Comments</label>

<input
id="comments"
value="482">

</div>


<div class="section">

<label>Story Title</label>

<input
id="title"
value="Something Happened Last Night">

</div>


<div class="section">

<label>Story</label>

<textarea id="story">Paste your Reddit story here...</textarea>

</div>


<div class="buttons">

<button id="update">

Update

</button>


<button id="obs">

OBS Mode

</button>


<button id="download">

Download PNG

</button>


<button
id="exitOBS"
style="display:none;">

← Exit OBS

</button>

</div>

</div>


<!-- =========================
     PREVIEW
========================= -->

<div class="preview">


<div class="redditCard" id="redditCard">


<!-- HEADER -->

<div class="redditHeader">


<div class="avatar">

<img
id="avatarImage"
src="assets/default-avatar.png">

</div>


<div>

<div
class="subreddit"
id="previewSubreddit">

r/LetsNotMeet

</div>


<div class="meta">

<span id="previewAuthor">

u/Anonymous

</span>

&nbsp;•&nbsp;

<span id="previewTime">

8 hr. ago

</span>

</div>

</div>

</div>


<!-- CONTENT -->

<div class="cardContent">


<h2 id="previewTitle">

Something Happened Last Night

</h2>


<div
class="story"
id="previewStory">

Paste your Reddit story here...

</div>


</div>


<!-- BOTTOM -->

<div class="bottomBar">


<div class="bottomItem">

<span class="upvoteIcon">▲</span>

<span id="previewUpvotes">

18.2k

</span>

</div>


<div class="bottomItem">

<span class="commentIcon">▰</span>

<span id="previewComments">

482

</span>

</div>


</div>


</div>

</div>


<script>

/* =========================
   ELEMENTS
========================= */

const avatarUpload =
document.getElementById("avatarUpload");

const avatarImage =
document.getElementById("avatarImage");

const subreddit =
document.getElementById("subreddit");

const author =
document.getElementById("author");

const time =
document.getElementById("time");

const upvotes =
document.getElementById("upvotes");

const comments =
document.getElementById("comments");

const title =
document.getElementById("title");

const story =
document.getElementById("story");

const updateBtn =
document.getElementById("update");

const obsBtn =
document.getElementById("obs");

const exitOBS =
document.getElementById("exitOBS");

const downloadBtn =
document.getElementById("download");


/* =========================
   PREVIEW ELEMENTS
========================= */

const previewSubreddit =
document.getElementById("previewSubreddit");

const previewAuthor =
document.getElementById("previewAuthor");

const previewTime =
document.getElementById("previewTime");

const previewUpvotes =
document.getElementById("previewUpvotes");

const previewComments =
document.getElementById("previewComments");

const previewTitle =
document.getElementById("previewTitle");

const previewStory =
document.getElementById("previewStory");


/* =========================
   UPDATE
========================= */

function updatePost(){

    previewSubreddit.textContent =
    subreddit.value;

    previewAuthor.textContent =
    author.value;

    previewTime.textContent =
    time.value;

    previewUpvotes.textContent =
    upvotes.value;

    previewComments.textContent =
    comments.value;

    previewTitle.textContent =
    title.value;

    previewStory.textContent =
    story.value;

}


/* =========================
   UPDATE BUTTON
========================= */

updateBtn.addEventListener(
"click",
updatePost
);


/* =========================
   LIVE UPDATE
========================= */

document
.querySelectorAll(".sidebar input, .sidebar textarea")
.forEach(input => {

    input.addEventListener(
    "input",
    updatePost
    );

});


/* =========================
   AVATAR
========================= */

avatarUpload.addEventListener(
"change",
function(e){

    const file =
    e.target.files[0];

    if(!file){

        return;

    }

    const reader =
    new FileReader();

    reader.onload =
    function(event){

        avatarImage.src =
        event.target.result;

    };

    reader.readAsDataURL(file);

});


/* =========================
   OBS MODE
========================= */

obsBtn.addEventListener(
"click",
function(){

    document.body.classList.add("obs");

    exitOBS.style.display =
    "block";

});


/* =========================
   EXIT OBS
========================= */

function exitObsMode(){

    document.body.classList.remove("obs");

    exitOBS.style.display =
    "none";

}

exitOBS.addEventListener(
"click",
exitObsMode
);


/* =========================
   ESCAPE
========================= */

document.addEventListener(
"keydown",
function(e){

    if(e.key === "Escape"){

        exitObsMode();

    }

});


/* =========================
   F11
========================= */

document.addEventListener(
"keydown",
function(e){

    if(
        e.key === "F11" &&
        !document.body.classList.contains("obs")
    ){

        e.preventDefault();

        document.body.classList.add("obs");

    }

});


/* =========================
   DOWNLOAD PNG
========================= */

downloadBtn.addEventListener(
"click",
async function(){

    const card =
    document.getElementById("redditCard");

    const storyBox =
    document.getElementById("previewStory");

    const cardContent =
    document.querySelector(".cardContent");

    const bottomBar =
    document.querySelector(".bottomBar");


    /* Сохраняем текущие значения */

    const oldCardHeight =
    card.style.height;

    const oldStoryOverflow =
    storyBox.style.overflow;

    const oldStoryHeight =
    storyBox.style.height;

    const oldStoryFlex =
    storyBox.style.flex;

    const oldContentFlex =
    cardContent.style.flex;


    /* =========================
       ВРЕМЕННО РАСКРЫВАЕМ ТЕКСТ
    ========================= */

    card.style.height =
    "auto";

    storyBox.style.overflow =
    "visible";

    storyBox.style.height =
    "auto";

    storyBox.style.flex =
    "none";

    cardContent.style.flex =
    "none";


    /* Даём браузеру обновить размеры */

    await new Promise(
    resolve =>
    requestAnimationFrame(resolve)
    );


    /* =========================
       СНИМАЕМ КАРТОЧКУ
    ========================= */

    const canvas =
    await html2canvas(
    card,
    {

        scale:2,

        backgroundColor: null,,

        useCORS:true,

        allowTaint:true,

        logging:false,

        imageTimeout:0

    });


    /* =========================
       ВОЗВРАЩАЕМ САЙТ
    ========================= */

    card.style.height =
    oldCardHeight;

    storyBox.style.overflow =
    oldStoryOverflow;

    storyBox.style.height =
    oldStoryHeight;

    storyBox.style.flex =
    oldStoryFlex;

    cardContent.style.flex =
    oldContentFlex;


    /* =========================
       СОХРАНЯЕМ PNG
    ========================= */

    const link =
    document.createElement("a");

    link.download =
    "reddit-story.png";

    link.href =
    canvas.toDataURL(
    "image/png"
    );

    link.click();

});


/* =========================
   START
========================= */

updatePost();

</script>


</body>

</html>
