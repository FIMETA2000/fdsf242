<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Reddit Story Studio</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<!-- Библиотека для создания PNG -->
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<style>

/* =========================================
   RESET
========================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    min-height: 100%;
    font-family: Inter, Arial, sans-serif;
    background: #00ff00;
    color: #ffffff;
}

/* =========================================
   MAIN PAGE
========================================= */

body {
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

/* =========================================
   SIDEBAR
========================================= */

.sidebar {
    position: fixed;
    left: 30px;
    top: 30px;

    width: 340px;
    height: calc(100vh - 60px);

    padding: 28px;

    overflow-y: auto;

    background: #111111;

    border: 1px solid #222222;
    border-radius: 24px;

    box-shadow: 0 20px 60px rgba(0,0,0,.35);

    z-index: 100;
}

.sidebar h1 {
    font-size: 28px;
    margin-bottom: 28px;
}

.section {
    margin-bottom: 20px;
}

.section label {
    display: block;

    margin-bottom: 8px;

    color: #dddddd;

    font-size: 14px;
    font-weight: 700;
}

.section input,
.section textarea {
    width: 100%;

    padding: 13px 14px;

    border: 1px solid #333333;
    border-radius: 12px;

    background: #181818;
    color: #ffffff;

    font-family: inherit;
    font-size: 14px;

    outline: none;
}

.section input:focus,
.section textarea:focus {
    border-color: #4d7cff;
}

.section textarea {
    height: 220px;

    resize: none;

    line-height: 1.5;
}

/* =========================================
   BUTTONS
========================================= */

.buttons {
    display: flex;
    flex-direction: column;

    gap: 12px;

    margin-top: 25px;
}

.buttons button {
    width: 100%;
    height: 52px;

    border: none;
    border-radius: 13px;

    background: #3265f5;
    color: #ffffff;

    font-family: inherit;
    font-size: 15px;
    font-weight: 700;

    cursor: pointer;

    transition: .2s;
}

.buttons button:hover {
    background: #4678ff;
    transform: translateY(-2px);
}

.buttons button:active {
    transform: scale(.98);
}

#exitOBS {
    background: #222222;
}

#exitOBS:hover {
    background: #333333;
}

/* =========================================
   PREVIEW AREA
========================================= */

.preview {
    position: absolute;

    left: 400px;
    right: 40px;

    top: 50%;

    transform: translateY(-50%);

    display: flex;

    justify-content: center;
    align-items: center;
}

/* =========================================
   REDDIT CARD
========================================= */

.redditCard {
    position: relative;

    width: min(1000px, calc(100vw - 480px));

    background: #000000;

    border: 1px solid #222222;

    border-radius: 28px;

    overflow: hidden;

    box-shadow: 0 25px 70px rgba(0,0,0,.45);

    display: flex;
    flex-direction: column;
}

/*
   ВАЖНО:

   Карточка НЕ имеет фиксированной высоты.
   Она растёт вместе с текстом.

   Поэтому при сохранении PNG
   вся история будет внутри картинки.
*/

/* =========================================
   HEADER
========================================= */

.redditHeader {
    display: flex;

    align-items: center;

    gap: 16px;

    padding: 35px 38px 0 38px;
}

.avatar {
    width: 62px;
    height: 62px;

    flex-shrink: 0;

    border-radius: 50%;

    overflow: hidden;

    background: #222222;
}

.avatar img {
    display: block;

    width: 100%;
    height: 100%;

    object-fit: cover;
}

.subreddit {
    font-size: 21px;
    font-weight: 800;

    color: #ffffff;
}

.meta {
    margin-top: 5px;

    color: #999999;

    font-size: 15px;
}

/* =========================================
   CONTENT
========================================= */

.cardContent {
    padding: 0 38px;
}

/* =========================================
   TITLE
========================================= */

.redditCard h2 {
    margin-top: 30px;
    margin-bottom: 25px;

    color: #ffffff;

    font-size: 38px;
    font-weight: 800;

    line-height: 1.25;

    overflow-wrap: anywhere;
    word-break: break-word;
}

/* =========================================
   STORY
========================================= */

.story {
    width: 100%;

    color: #ffffff;

    font-size: 25px;

    line-height: 1.65;

    white-space: pre-wrap;

    overflow-wrap: anywhere;
    word-break: break-word;

    padding-bottom: 20px;
}

/*
   ВАЖНО:

   НЕТ overflow-y: auto
   НЕТ max-height
   НЕТ фиксированной высоты

   Поэтому весь текст виден
   и сохраняется в PNG.
*/

/* =========================================
   BOTTOM BAR
========================================= */

.bottomBar {
    display: flex;

    align-items: center;

    gap: 35px;

    padding: 20px 38px 30px 38px;

    background: #000000;

    color: #ffffff;

    font-size: 20px;
}

.bottomItem {
    display: flex;

    align-items: center;

    gap: 8px;
}

.upvoteIcon {
    font-size: 24px;
    line-height: 1;
}

.commentIcon {
    font-size: 22px;
    line-height: 1;
}

/* =========================================
   OBS MODE
========================================= */

body.obs {
    background: #00ff00;
}

body.obs .sidebar {
    display: none;
}

body.obs .preview {
    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    margin: 0;

    transform: none;

    display: flex;

    justify-content: center;
    align-items: center;
}

body.obs .redditCard {
    width: 1200px;

    max-width: calc(100vw - 80px);

    max-height: calc(100vh - 80px);

    overflow-y: auto;
}

/* =========================================
   SCROLLBAR
========================================= */

.sidebar::-webkit-scrollbar {
    width: 7px;
}

.sidebar::-webkit-scrollbar-track {
    background: #111111;
}

.sidebar::-webkit-scrollbar-thumb {
    background: #444444;
    border-radius: 20px;
}

/* =========================================
   MOBILE
========================================= */

@media(max-width: 1400px) {

    .sidebar {
        width: 320px;
    }

    .preview {
        left: 370px;
    }

    .redditCard {
        width: calc(100vw - 420px);
    }

    .redditCard h2 {
        font-size: 32px;
    }

    .story {
        font-size: 22px;
    }
}

</style>
</head>


<body>

<!-- =========================================
     SIDEBAR
========================================= -->

<div class="sidebar">

    <h1>Reddit Story Studio</h1>

    <div class="section">

        <label>Avatar</label>

        <input
            type="file"
            id="avatarUpload"
            accept="image/*"
        >

    </div>


    <div class="section">

        <label>Subreddit</label>

        <input
            id="subreddit"
            value="r/LetsNotMeet"
        >

    </div>


    <div class="section">

        <label>Author</label>

        <input
            id="author"
            value="u/Anonymous"
        >

    </div>


    <div class="section">

        <label>Time</label>

        <input
            id="time"
            value="8 hr. ago"
        >

    </div>


    <div class="section">

        <label>Upvotes</label>

        <input
            id="upvotes"
            value="18.2k"
        >

    </div>


    <div class="section">

        <label>Comments</label>

        <input
            id="comments"
            value="482"
        >

    </div>


    <div class="section">

        <label>Story Title</label>

        <input
            id="title"
            value="Something Happened Last Night"
        >

    </div>


    <div class="section">

        <label>Story</label>

        <textarea id="story">Paste your Reddit story here...</textarea>

    </div>


    <div class="buttons">

        <button id="update">
            Update
        </button>

        <button id="obs">
            OBS Mode
        </button>

        <button id="download">
            Download PNG
        </button>

        <button
            id="exitOBS"
            style="display:none;"
        >
            ← Exit OBS
        </button>

    </div>

</div>


<!-- =========================================
     PREVIEW
========================================= -->

<div class="preview">

    <div
        class="redditCard"
        id="redditCard"
    >

        <!-- HEADER -->

        <div class="redditHeader">

            <div class="avatar">

                <img
                    id="avatarImage"
                    alt="Avatar"
                >

            </div>


            <div>

                <div
                    class="subreddit"
                    id="previewSubreddit"
                >
                    r/LetsNotMeet
                </div>


                <div class="meta">

                    <span id="previewAuthor">
                        u/Anonymous
                    </span>

                    &nbsp;•&nbsp;

                    <span id="previewTime">
                        8 hr. ago
                    </span>

                </div>

            </div>

        </div>


        <!-- CONTENT -->

        <div class="cardContent">

            <h2 id="previewTitle">
                Something Happened Last Night
            </h2>


            <div
                class="story"
                id="previewStory"
            >
                Paste your Reddit story here...
            </div>

        </div>


        <!-- BOTTOM -->

        <div class="bottomBar">

            <div class="bottomItem">

                <span class="upvoteIcon">
                    ▲
                </span>

                <span id="previewUpvotes">
                    18.2k
                </span>

            </div>


            <div class="bottomItem">

                <span class="commentIcon">
                    ▰
                </span>

                <span id="previewComments">
                    482
                </span>

            </div>

        </div>

    </div>

</div>


<script>

/* =========================================
   ELEMENTS
========================================= */

const avatarUpload =
    document.getElementById("avatarUpload");

const avatarImage =
    document.getElementById("avatarImage");

const subreddit =
    document.getElementById("subreddit");

const author =
    document.getElementById("author");

const time =
    document.getElementById("time");

const upvotes =
    document.getElementById("upvotes");

const comments =
    document.getElementById("comments");

const title =
    document.getElementById("title");

const story =
    document.getElementById("story");

const updateBtn =
    document.getElementById("update");

const obsBtn =
    document.getElementById("obs");

const exitOBS =
    document.getElementById("exitOBS");

const downloadBtn =
    document.getElementById("download");


/* =========================================
   PREVIEW ELEMENTS
========================================= */

const previewSubreddit =
    document.getElementById("previewSubreddit");

const previewAuthor =
    document.getElementById("previewAuthor");

const previewTime =
    document.getElementById("previewTime");

const previewUpvotes =
    document.getElementById("previewUpvotes");

const previewComments =
    document.getElementById("previewComments");

const previewTitle =
    document.getElementById("previewTitle");

const previewStory =
    document.getElementById("previewStory");

const redditCard =
    document.getElementById("redditCard");


/* =========================================
   UPDATE POST
========================================= */

function updatePost() {

    previewSubreddit.textContent =
        subreddit.value;

    previewAuthor.textContent =
        author.value;

    previewTime.textContent =
        time.value;

    previewUpvotes.textContent =
        upvotes.value;

    previewComments.textContent =
        comments.value;

    previewTitle.textContent =
        title.value;

    previewStory.textContent =
        story.value;

}


/* =========================================
   UPDATE BUTTON
========================================= */

updateBtn.addEventListener(
    "click",
    updatePost
);


/* =========================================
   LIVE UPDATE
========================================= */

[
    subreddit,
    author,
    time,
    upvotes,
    comments,
    title,
    story
].forEach(function(input) {

    input.addEventListener(
        "input",
        updatePost
    );

});


/* =========================================
   AVATAR UPLOAD
========================================= */

avatarUpload.addEventListener(
    "change",
    function(event) {

        const file =
            event.target.files[0];

        if (!file) {
            return;
        }

        const reader =
            new FileReader();

        reader.onload =
            function(e) {

                avatarImage.src =
                    e.target.result;

            };

        reader.readAsDataURL(file);

    }
);


/* =========================================
   OBS MODE
========================================= */

obsBtn.addEventListener(
    "click",
    function() {

        document.body.classList.add("obs");

        exitOBS.style.display =
            "block";

    }
);


/* =========================================
   EXIT OBS
========================================= */

function exitObsMode() {

    document.body.classList.remove("obs");

    exitOBS.style.display =
        "none";

}


exitOBS.addEventListener(
    "click",
    exitObsMode
);


/* =========================================
   ESCAPE
========================================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Escape") {

            exitObsMode();

        }

    }
);


/* =========================================
   F11
========================================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "F11") {

            event.preventDefault();

            if (
                document.body.classList.contains("obs")
            ) {

                exitObsMode();

            } else {

                document.body.classList.add("obs");

                exitOBS.style.display =
                    "block";

            }

        }

    }
);


/* =========================
   DOWNLOAD PNG
========================= */

downloadBtn.addEventListener("click", async function () {

    const card = document.getElementById("redditCard");

    if (!card) {
        alert("Карточка не найдена");
        return;
    }

    // Сохраняем исходные настройки карточки
    const oldScrollTop = card.scrollTop;

    // Временно убираем тень,
    // чтобы за пределами карточки ничего не появлялось
    const oldBoxShadow = card.style.boxShadow;

    card.style.boxShadow = "none";

    try {

        // Ждём перерисовку
        await new Promise(resolve =>
            requestAnimationFrame(resolve)
        );

        // Снимаем РОВНО текущую карточку
        // Никакого auto height
        // Никакого раскрытия текста
        const canvas = await html2canvas(card, {

            width: card.offsetWidth,
            height: card.offsetHeight,

            scale: 2,

            backgroundColor: null,

            useCORS: true,

            allowTaint: true,

            logging: false,

            removeContainer: true,

            // Важно для круглых углов
            onclone: function (clonedDocument) {

                const clonedCard =
                    clonedDocument.getElementById("redditCard");

                if (clonedCard) {

                    clonedCard.style.width =
                        card.offsetWidth + "px";

                    clonedCard.style.height =
                        card.offsetHeight + "px";

                    clonedCard.style.maxWidth = "none";

                    clonedCard.style.maxHeight = "none";

                    clonedCard.style.borderRadius = "28px";

                    clonedCard.style.overflow = "hidden";

                    clonedCard.style.boxShadow = "none";

                    clonedCard.style.background = "#000000";

                }

            }

        });

        // Восстанавливаем карточку
        card.style.boxShadow = oldBoxShadow;

        card.scrollTop = oldScrollTop;


        // =========================
        // СОЗДАЁМ PNG
        // =========================

        canvas.toBlob(function(blob) {

            if (!blob) {

                alert("Не удалось создать PNG");

                return;

            }

            const url =
                URL.createObjectURL(blob);

            const link =
                document.createElement("a");

            link.style.display = "none";

            link.href = url;

            link.download =
                "reddit-story.png";

            document.body.appendChild(link);

            link.click();

            setTimeout(function() {

                document.body.removeChild(link);

                URL.revokeObjectURL(url);

            }, 1000);

        }, "image/png");


    } catch (error) {

        // Восстанавливаем карточку даже если произошла ошибка
        card.style.boxShadow = oldBoxShadow;

        card.scrollTop = oldScrollTop;

        console.error(
            "Ошибка сохранения PNG:",
            error
        );

        alert(
            "Ошибка при создании PNG. Открой F12 → Console."
        );

    }

});


            /* ---------------------------------
               ВОЗВРАЩАЕМ СТИЛИ
            --------------------------------- */

            redditCard.style.width =
                oldWidth;

            redditCard.style.maxWidth =
                oldMaxWidth;

            redditCard.style.height =
                oldHeight;

            redditCard.style.maxHeight =
                oldMaxHeight;

            redditCard.style.overflow =
                oldOverflow;


            /* ---------------------------------
               ВОЗВРАЩАЕМ OBS
            --------------------------------- */

            if (wasOBS) {

                document.body.classList.add("obs");

            }


            /* ---------------------------------
               PNG → BLOB

               Это надёжнее, чем
               canvas.toDataURL + link.click()
            --------------------------------- */

            canvas.toBlob(
                function(blob) {

                    if (!blob) {

                        alert(
                            "Не удалось создать PNG."
                        );

                        return;

                    }


                    /* Создаём временный URL */

                    const url =
                        URL.createObjectURL(blob);


                    /* Создаём ссылку */

                    const link =
                        document.createElement("a");

                    link.href =
                        url;

                    link.download =
                        "reddit-story.png";

                    link.style.display =
                        "none";


                    /* Добавляем в страницу */

                    document.body.appendChild(link);


                    /* Запускаем скачивание */

                    link.click();


                    /* Удаляем ссылку */

                    setTimeout(
                        function() {

                            document.body.removeChild(
                                link
                            );

                            URL.revokeObjectURL(
                                url
                            );

                        },
                        2000
                    );

                },
                "image/png"
            );


        } catch(error) {

            /* ---------------------------------
               ВОЗВРАЩАЕМ СТИЛИ ПРИ ОШИБКЕ
            --------------------------------- */

            redditCard.style.width =
                oldWidth;

            redditCard.style.maxWidth =
                oldMaxWidth;

            redditCard.style.height =
                oldHeight;

            redditCard.style.maxHeight =
                oldMaxHeight;

            redditCard.style.overflow =
                oldOverflow;


            if (wasOBS) {

                document.body.classList.add("obs");

            }


            console.error(
                "PNG ERROR:",
                error
            );


            alert(
                "Ошибка создания PNG. Открой F12 → Console и посмотри ошибку."
            );

        }

    }
);


/* =========================================
   DEFAULT AVATAR
========================================= */

avatarImage.src =
    "data:image/svg+xml;charset=UTF-8," +
    encodeURIComponent(`
        <svg
            xmlns="http://www.w3.org/2000/svg"
            width="100"
            height="100"
            viewBox="0 0 100 100"
        >
            <rect
                width="100"
                height="100"
                fill="#222222"
            />
            <circle
                cx="50"
                cy="38"
                r="18"
                fill="#777777"
            />
            <path
                d="M20 90
                   C20 68 32 58 50 58
                   C68 58 80 68 80 90"
                fill="#777777"
            />
        </svg>
    `);


/* =========================================
   INITIAL UPDATE
========================================= */

updatePost();

</script>

</body>
</html>
